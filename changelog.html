<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes de mise a jour . CSSCT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#019682; --teal-dark:#017162; --purple:#5A4570; --gold:#C6AB76;
    --paper:#F7F5F1; --ink:#2B2A2E; --ink-soft:#6B6873; --line:#E4E0D8; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',system-ui,sans-serif; line-height:1.55;}
  .wrap{max-width:720px; margin:0 auto; padding:32px 24px 80px;}
  header.top{display:flex; align-items:center; justify-content:space-between; padding-bottom:20px; border-bottom:2px solid var(--ink); margin-bottom:26px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{width:38px; height:38px; border-radius:50%;
    background:conic-gradient(var(--teal) 0deg 120deg, var(--gold) 120deg 240deg, var(--purple) 240deg 360deg); flex:none;}
  .brand-text{font-family:'Source Serif 4', serif; font-weight:700; font-size:19px;}
  .brand-text span{color:var(--teal);}
  .back-link{font-size:12.5px; font-weight:600; color:var(--ink-soft); text-decoration:none; border:1px solid var(--line); padding:6px 14px; border-radius:20px;}

  h1{font-family:'Source Serif 4',serif; font-size:22px; margin:0 0 6px;}
  .subtitle{color:var(--ink-soft); font-size:13.5px; margin:0 0 32px;}

  .timeline{position:relative; padding-left:24px; border-left:2px solid var(--line);}
  .entry{position:relative; margin-bottom:26px;}
  .entry::before{
    content:''; position:absolute; left:-31px; top:4px; width:12px; height:12px;
    border-radius:50%; background:var(--teal); border:3px solid var(--paper);
  }
  .entry .date{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); float:right;}
  .entry h2{font-family:'Source Serif 4',serif; font-size:16px; margin:2px 0 6px; color:var(--ink);}
  .entry p{margin:0; font-size:13.5px; color:var(--ink); white-space:pre-wrap;}
  .entry p.empty{color:var(--ink-soft); font-style:italic;}

  .state-msg{font-size:13.5px; color:var(--ink-soft); padding:20px 0;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-text">CS<span>2E</span> . CSSCT</div>
    </div>
    <a class="back-link" href="index.html">Retour a l'appli</a>
  </header>

  <h1>Notes de mise a jour</h1>
  <p class="subtitle">Genere automatiquement depuis l'historique des mises a jour du site.</p>

  <div id="timelineContainer">
    <div class="state-msg">Chargement...</div>
  </div>
</div>

<script>
fetch('./changelog-data.json?t=' + Date.now())
  .then(function(r){ if(!r.ok) throw new Error('not found'); return r.json(); })
  .then(function(entries){
    const container = document.getElementById('timelineContainer');
    if(!entries || !entries.length){
      container.innerHTML = '<div class="state-msg">Aucune mise a jour enregistree pour le moment.</div>';
      return;
    }
    const timeline = document.createElement('div');
    timeline.className = 'timeline';
    entries.forEach(function(e){
      const div = document.createElement('div');
      div.className = 'entry';
      const desc = (e.description || '').trim();
      div.innerHTML =
        '<span class="date">' + escapeHtml(e.date || '') + '</span>' +
        '<h2>' + escapeHtml(e.title || '(sans titre)') + '</h2>' +
        '<p class="' + (desc ? '' : 'empty') + '">' + (desc ? escapeHtml(desc) : 'Pas de description.') + '</p>';
      timeline.appendChild(div);
    });
    container.innerHTML = '';
    container.appendChild(timeline);
  })
  .catch(function(){
    document.getElementById('timelineContainer').innerHTML =
      '<div class="state-msg">Le fichier des mises a jour n\u2019est pas encore disponible. Il apparaitra apres le premier envoi de code sur GitHub.</div>';
  });

function escapeHtml(s){
  return s.replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
</script>
</body>
</html>
