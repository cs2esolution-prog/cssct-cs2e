<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trousses de secours . CSSCT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#019682; --teal-dark:#017162; --purple:#5A4570; --gold:#C6AB76;
    --paper:#F7F5F1; --paper-raised:#fff; --ink:#2B2A2E; --ink-soft:#6B6873; --line:#E4E0D8; --danger:#A85D45; --radius:10px;
    --ok:#019682; --warn:#C6924A; --bad:#A85D45;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',system-ui,sans-serif; line-height:1.5;}
  .wrap{max-width:1080px; margin:0 auto; padding:32px 24px 90px;}
  header.top{display:flex; align-items:center; justify-content:space-between; padding-bottom:20px; border-bottom:2px solid var(--ink); margin-bottom:24px; flex-wrap:wrap; gap:10px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{width:38px; height:38px; border-radius:50%;
    background:conic-gradient(var(--teal) 0deg 120deg, var(--gold) 120deg 240deg, var(--purple) 240deg 360deg); flex:none;}
  .brand-text{font-family:'Source Serif 4', serif; font-weight:700; font-size:19px;}
  .brand-text span{color:var(--teal);}
  .back-link{font-size:12.5px; font-weight:600; color:var(--ink-soft); text-decoration:none; border:1px solid var(--line); padding:6px 14px; border-radius:20px;}

  h1{font-family:'Source Serif 4',serif; font-size:20px; margin:0 0 4px;}
  .subtitle{font-size:12.5px; color:var(--ink-soft); margin:0 0 20px;}

  .summary-row{display:flex; gap:14px; margin-bottom:24px; flex-wrap:wrap;}
  .summary-tile{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:14px 18px; flex:1; min-width:140px;}
  .summary-tile .num{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:700;}
  .summary-tile .lbl{font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em;}

  .site-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); margin-bottom:16px; overflow:hidden;}
  .site-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; cursor:pointer; background:#fff;}
  .site-head h2{font-family:'Source Serif 4',serif; font-size:15.5px; margin:0; display:flex; align-items:center; gap:10px;}
  .site-badges{display:flex; gap:6px;}
  .badge{font-size:10.5px; font-weight:600; padding:3px 9px; border-radius:12px;}
  .badge-ok{background:#E4F3EF; color:var(--ok);}
  .badge-warn{background:#F5EBD9; color:var(--warn);}
  .badge-bad{background:#F3DCD6; color:var(--bad);}
  .chevron{width:18px; height:18px; color:var(--ink-soft); transition:transform .2s;}
  .site-card.open .chevron{transform:rotate(180deg);}
  .site-body{max-height:0; overflow:hidden; transition:max-height .25s ease;}
  .site-card.open .site-body{max-height:4000px;}
  .site-body-inner{padding:0 20px 20px;}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th, td{text-align:left; padding:8px 8px; border-bottom:1px solid var(--line);}
  th{color:var(--ink-soft); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;}
  tr.item-row{cursor:pointer;}
  tr.item-row:hover{background:#FBFAF7;}
  .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px;}
  .dot-ok{background:var(--ok);} .dot-warn{background:var(--warn);} .dot-bad{background:var(--bad);}
  .qty-bad{color:var(--bad); font-weight:600;}

  .add-item-btn{margin-top:12px; background:#fff; border:1px solid var(--line); color:var(--ink); font-size:12.5px; font-weight:600; padding:9px 16px; border-radius:20px; cursor:pointer;}
  .add-item-btn:hover{border-color:var(--teal); color:var(--teal-dark);}

  .modal-overlay{position:fixed; inset:0; background:rgba(30,28,32,.55); display:none; align-items:flex-start; justify-content:center; padding:32px 16px; z-index:150; overflow:auto;}
  .modal-overlay.show{display:flex;}
  .modal{background:#fff; border-radius:var(--radius); max-width:520px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 24px; border-bottom:1px solid var(--line);}
  .modal-head h3{font-family:'Source Serif 4',serif; margin:0; font-size:16px;}
  .modal-close{background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-soft);}
  .modal-body{padding:20px 24px;}
  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
  .field label{font-size:12px; font-weight:600;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  input, select{width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:7px; font-size:13.5px; font-family:'Inter',sans-serif;}
  .modal-actions{display:flex; justify-content:space-between; padding:14px 24px; border-top:1px solid var(--line);}
  button.primary{background:var(--ink); color:#fff; border:none; padding:10px 18px; border-radius:20px; font-weight:600; font-size:13px; cursor:pointer;}
  button.ghost{background:none; border:1px solid var(--line); padding:10px 18px; border-radius:20px; font-weight:600; font-size:13px; cursor:pointer; color:var(--ink-soft);}
  button.danger-link{background:none; border:none; color:var(--danger); font-size:12.5px; font-weight:600; cursor:pointer;}

  #toast{position:fixed; left:50%; bottom:24px; transform:translate(-50%,120%); background:var(--ink); color:#fff; padding:12px 20px; border-radius:12px; font-size:13.5px; transition:transform .3s ease; z-index:250; max-width:90vw;}
  #toast.show{transform:translate(-50%,0);}

  #authGate{position:fixed;inset:0;background:#2B2A2E;display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
  #authForm{display:none;background:#fff;border-radius:14px;padding:32px;max-width:360px;width:100%;text-align:center;}
</style>
</head>
<body>

<div id="authGate">
  <div id="authChecking" style="color:#ffffffaa;font-size:13.5px;">Vérification de la connexion…</div>
  <div id="authForm">
    <div style="font-family:'Source Serif 4',serif;font-weight:700;font-size:18px;margin-bottom:6px;">CS<span style="color:#019682;">2E</span> · CSSCT</div>
    <p style="font-size:13px;color:#6B6873;margin:0 0 18px;">Connecte-toi avec ton email professionnel.</p>
    <input type="email" id="authEmail" placeholder="prenom.nom@entreprise.com" style="width:100%;padding:10px 12px;border:1px solid #E4E0D8;border-radius:8px;font-size:13.5px;margin-bottom:10px;">
    <button id="authSendLink" style="width:100%;background:#2B2A2E;color:#fff;border:none;padding:11px;border-radius:20px;font-weight:600;cursor:pointer;">Recevoir un lien de connexion</button>
    <div id="authMsg" style="font-size:12px;color:#A85D45;margin-top:10px;min-height:14px;"></div>
  </div>
</div>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-text">CS<span>2E</span> · CSSCT</div>
    </div>
    <a class="back-link" href="signalement_liste.html">Retour aux dossiers</a>
  </header>

  <h1>Trousses de secours</h1>
  <p class="subtitle">Inventaire par site, contrôles et dates de péremption.</p>

  <div class="summary-row" id="summaryRow"></div>
  <div id="sitesContainer"><div style="font-size:13px;color:var(--ink-soft);">Chargement…</div></div>
</div>

<div id="toast"></div>

<div class="modal-overlay" id="itemModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="itemModalTitle">Ajouter un article</h3>
      <button class="modal-close" id="closeItemModal">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="itemId">
      <div class="field"><label>Site</label><input type="text" id="itemSite" placeholder="Ex : Montpellier"></div>
      <div class="field"><label>Entité</label><input type="text" id="itemEntite" placeholder="Ex : SMAG / AS"></div>
      <div class="field"><label>Emplacement de la trousse</label><input type="text" id="itemEmplacement" placeholder="Ex : Meuble bas, derrière l'accueil"></div>
      <div class="field"><label>Contenu (article)</label><input type="text" id="itemContenu" placeholder="Ex : Compresses stériles"></div>
      <div class="grid2">
        <div class="field"><label>Quantité théorique</label><input type="number" id="itemQteTheo" min="0"></div>
        <div class="field"><label>Quantité réelle</label><input type="number" id="itemQteReelle" min="0"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Date de péremption</label><input type="date" id="itemPeremption"></div>
        <div class="field"><label>Dernier contrôle</label><input type="date" id="itemDernierControle"></div>
      </div>
      <div class="field"><label>Périodicité de contrôle (mois)</label><input type="number" id="itemPeriodicite" min="1" value="12"></div>
    </div>
    <div class="modal-actions">
      <button class="danger-link" id="deleteItemBtn" style="display:none;">Supprimer l'article</button>
      <div style="margin-left:auto;display:flex;gap:8px;">
        <button class="ghost" id="cancelItemBtn">Annuler</button>
        <button class="primary" id="saveItemBtn">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getAuth, sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
  import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB6c5xe4bg5JVUCJXsHcJBj3mFniALh39E",
    authDomain: "cssct-cs2e.firebaseapp.com",
    projectId: "cssct-cs2e",
    storageBucket: "cssct-cs2e.firebasestorage.app",
    messagingSenderId: "921964040050",
    appId: "1:921964040050:web:578fcc81ca212b741697eb"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const col = collection(db, "trousses_secours");

  const actionCodeSettings = { url: window.location.origin + window.location.pathname, handleCodeInApp: true };

  if (isSignInWithEmailLink(auth, window.location.href)) {
    let email = window.prompt("Confirme ton adresse email pour terminer la connexion :");
    signInWithEmailLink(auth, email, window.location.href)
      .then(() => window.history.replaceState({}, document.title, window.location.pathname))
      .catch(err => alert("Connexion impossible : " + err.message));
  }

  let unsubscribe = null;
  onAuthStateChanged(auth, (user) => {
    document.getElementById('authChecking').style.display = 'none';
    if (user) {
      document.getElementById('authGate').style.display = 'none';
      if(!unsubscribe){
        unsubscribe = onSnapshot(col, (snap) => {
          window._items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          window.renderTrousses();
        });
      }
    } else {
      document.getElementById('authGate').style.display = 'flex';
      document.getElementById('authForm').style.display = 'block';
    }
  });

  document.getElementById('authSendLink').addEventListener('click', () => {
    const email = document.getElementById('authEmail').value.trim();
    const msg = document.getElementById('authMsg');
    if (!email) { msg.textContent = "Merci de saisir ton email."; return; }
    sendSignInLinkToEmail(auth, email, actionCodeSettings)
      .then(() => { msg.style.color = '#019682'; msg.textContent = "Lien envoyé, vérifie ta boîte mail."; })
      .catch(err => { msg.textContent = "Erreur : " + err.message; });
  });

  window.TROUSSES_FIREBASE = {
    async add(item){ await addDoc(col, item); },
    async update(id, fields){ await updateDoc(doc(db,'trousses_secours', id), fields); },
    async remove(id){ await deleteDoc(doc(db,'trousses_secours', id)); }
  };
</script>

<script>
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function daysUntil(iso){
  if(!iso) return null;
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d.getTime())) return null;
  return Math.round((d - new Date())/(1000*60*60*24));
}
function statusFromDays(days){
  if(days === null) return 'none';
  if(days < 0) return 'bad';
  if(days <= 30) return 'warn';
  return 'ok';
}
function computeNextControl(item){
  if(item.dateProchainControle) return item.dateProchainControle;
  if(item.dateDernierControle && item.periodiciteControleMois){
    const d = new Date(item.dateDernierControle + 'T00:00:00');
    d.setMonth(d.getMonth() + Number(item.periodiciteControleMois));
    return d.toISOString().slice(0,10);
  }
  return null;
}
function itemStatus(item){
  const peremptionDays = daysUntil(item.datePeremption);
  const controleDays = daysUntil(computeNextControl(item));
  const reapproNeeded = (item.quantiteReelle !== undefined && item.quantiteTheorique !== undefined) && Number(item.quantiteReelle) < Number(item.quantiteTheorique);
  const statuses = [statusFromDays(peremptionDays), statusFromDays(controleDays)];
  let worst = 'ok';
  if(statuses.includes('bad') || reapproNeeded) worst = reapproNeeded && !statuses.includes('bad') ? 'warn' : (statuses.includes('bad') ? 'bad' : 'ok');
  else if(statuses.includes('warn')) worst = 'warn';
  return { peremptionDays, controleDays, reapproNeeded, worst };
}

window.renderTrousses = function(){
  const items = window._items || [];
  const bySite = {};
  items.forEach(function(it){
    const s = it.site || 'Non renseigné';
    if(!bySite[s]) bySite[s] = [];
    bySite[s].push(it);
  });
  const sites = Object.keys(bySite).sort(function(a,b){ return a.localeCompare(b,'fr'); });

  // Résumé global
  let totalBad = 0, totalWarn = 0, totalReappro = 0;
  items.forEach(function(it){
    const st = itemStatus(it);
    if(st.worst === 'bad') totalBad++;
    else if(st.worst === 'warn') totalWarn++;
    if(st.reapproNeeded) totalReappro++;
  });
  document.getElementById('summaryRow').innerHTML =
    '<div class="summary-tile"><div class="num">' + items.length + '</div><div class="lbl">Articles suivis</div></div>' +
    '<div class="summary-tile"><div class="num" style="color:var(--bad);">' + totalBad + '</div><div class="lbl">A traiter (dépassé)</div></div>' +
    '<div class="summary-tile"><div class="num" style="color:var(--warn);">' + totalWarn + '</div><div class="lbl">A surveiller (&lt; 30j)</div></div>' +
    '<div class="summary-tile"><div class="num" style="color:var(--bad);">' + totalReappro + '</div><div class="lbl">A réapprovisionner</div></div>';

  const container = document.getElementById('sitesContainer');
  if(!sites.length){
    container.innerHTML = '<div style="font-size:13px;color:var(--ink-soft);">Aucun article enregistré. Clique sur "Ajouter un article" pour commencer.</div>' +
      '<button class="add-item-btn" onclick="openItemModal(null, \'\')" style="margin-top:12px;">+ Ajouter un article</button>';
    return;
  }

  container.innerHTML = sites.map(function(site, idx){
    const siteItems = bySite[site];
    let siteBad = 0, siteWarn = 0;
    siteItems.forEach(function(it){ const st = itemStatus(it); if(st.worst==='bad') siteBad++; else if(st.worst==='warn') siteWarn++; });
    const badges = (siteBad ? '<span class="badge badge-bad">' + siteBad + ' à traiter</span>' : '') +
      (siteWarn ? '<span class="badge badge-warn">' + siteWarn + ' à surveiller</span>' : '') +
      (!siteBad && !siteWarn ? '<span class="badge badge-ok">OK</span>' : '');

    const rows = siteItems.map(function(it){
      const st = itemStatus(it);
      const dotClass = 'dot-' + (st.worst === 'none' ? 'ok' : st.worst);
      const peremptionTxt = it.datePeremption ? it.datePeremption.split('-').reverse().join('/') : '—';
      const controleTxt = computeNextControl(it) ? computeNextControl(it).split('-').reverse().join('/') : '—';
      return '<tr class="item-row" onclick="openItemModal(\'' + it.id + '\')">' +
        '<td><span class="dot ' + dotClass + '"></span>' + esc(it.contenu) + '</td>' +
        '<td class="' + (st.reapproNeeded ? 'qty-bad' : '') + '">' + (it.quantiteReelle ?? '—') + ' / ' + (it.quantiteTheorique ?? '—') + '</td>' +
        '<td>' + peremptionTxt + '</td>' +
        '<td>' + controleTxt + '</td>' +
        '<td>' + esc(it.emplacement) + '</td>' +
      '</tr>';
    }).join('');

    return '<div class="site-card' + (idx===0?' open':'') + '" data-site-idx="' + idx + '">' +
      '<div class="site-head" onclick="this.closest(\'.site-card\').classList.toggle(\'open\')">' +
        '<h2>' + esc(site) + ' <span style="font-size:11px;color:var(--ink-soft);font-weight:400;">(' + siteItems.length + ')</span></h2>' +
        '<div style="display:flex;align-items:center;gap:10px;"><div class="site-badges">' + badges + '</div>' +
        '<svg class="chevron" viewBox="0 0 20 20" fill="none"><path d="M5 7l5 6 5-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
      '</div>' +
      '<div class="site-body"><div class="site-body-inner">' +
        '<table><thead><tr><th>Article</th><th>Qté (réelle/théo.)</th><th>Péremption</th><th>Prochain contrôle</th><th>Emplacement</th></tr></thead><tbody>' + rows + '</tbody></table>' +
        '<button class="add-item-btn" onclick="event.stopPropagation();openItemModal(null,\'' + esc(site).replace(/'/g,"\\'") + '\')">+ Ajouter un article sur ce site</button>' +
      '</div></div>' +
    '</div>';
  }).join('');
};

window.openItemModal = function(id, prefillSite){
  const modal = document.getElementById('itemModal');
  document.getElementById('deleteItemBtn').style.display = id ? 'inline-block' : 'none';
  if(id){
    const it = (window._items||[]).find(function(x){ return x.id === id; });
    document.getElementById('itemModalTitle').textContent = 'Modifier l\u2019article';
    document.getElementById('itemId').value = id;
    document.getElementById('itemSite').value = it.site || '';
    document.getElementById('itemEntite').value = it.entite || '';
    document.getElementById('itemEmplacement').value = it.emplacement || '';
    document.getElementById('itemContenu').value = it.contenu || '';
    document.getElementById('itemQteTheo').value = it.quantiteTheorique ?? '';
    document.getElementById('itemQteReelle').value = it.quantiteReelle ?? '';
    document.getElementById('itemPeremption').value = it.datePeremption || '';
    document.getElementById('itemDernierControle').value = it.dateDernierControle || '';
    document.getElementById('itemPeriodicite').value = it.periodiciteControleMois || 12;
  } else {
    document.getElementById('itemModalTitle').textContent = 'Ajouter un article';
    document.getElementById('itemId').value = '';
    document.getElementById('itemSite').value = prefillSite || '';
    document.getElementById('itemEntite').value = '';
    document.getElementById('itemEmplacement').value = '';
    document.getElementById('itemContenu').value = '';
    document.getElementById('itemQteTheo').value = '';
    document.getElementById('itemQteReelle').value = '';
    document.getElementById('itemPeremption').value = '';
    document.getElementById('itemDernierControle').value = '';
    document.getElementById('itemPeriodicite').value = 12;
  }
  modal.classList.add('show');
};

document.getElementById('closeItemModal').addEventListener('click', function(){ document.getElementById('itemModal').classList.remove('show'); });
document.getElementById('cancelItemBtn').addEventListener('click', function(){ document.getElementById('itemModal').classList.remove('show'); });
document.getElementById('itemModal').addEventListener('click', function(e){ if(e.target.id==='itemModal') e.currentTarget.classList.remove('show'); });

document.getElementById('saveItemBtn').addEventListener('click', async function(){
  const id = document.getElementById('itemId').value;
  const fields = {
    site: document.getElementById('itemSite').value.trim(),
    entite: document.getElementById('itemEntite').value.trim(),
    emplacement: document.getElementById('itemEmplacement').value.trim(),
    contenu: document.getElementById('itemContenu').value.trim(),
    quantiteTheorique: document.getElementById('itemQteTheo').value === '' ? null : Number(document.getElementById('itemQteTheo').value),
    quantiteReelle: document.getElementById('itemQteReelle').value === '' ? null : Number(document.getElementById('itemQteReelle').value),
    datePeremption: document.getElementById('itemPeremption').value || null,
    dateDernierControle: document.getElementById('itemDernierControle').value || null,
    periodiciteControleMois: Number(document.getElementById('itemPeriodicite').value) || 12
  };
  if(!fields.site || !fields.contenu){ showToast('Site et Contenu sont obligatoires.'); return; }
  try{
    if(id){ await window.TROUSSES_FIREBASE.update(id, fields); showToast('Article mis à jour'); }
    else { await window.TROUSSES_FIREBASE.add(fields); showToast('Article ajouté'); }
    document.getElementById('itemModal').classList.remove('show');
  }catch(err){ showToast('Erreur : ' + err.message); }
});

document.getElementById('deleteItemBtn').addEventListener('click', async function(){
  const id = document.getElementById('itemId').value;
  if(!id) return;
  if(!confirm('Supprimer cet article ?')) return;
  try{
    await window.TROUSSES_FIREBASE.remove(id);
    showToast('Article supprimé');
    document.getElementById('itemModal').classList.remove('show');
  }catch(err){ showToast('Erreur : ' + err.message); }
});

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3200);
}
</script>
</body>
</html>
